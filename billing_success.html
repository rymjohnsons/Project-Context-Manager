<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Welcome to Pro — Tabrador</title>
  <!-- Auto-redirect to the app after 3 seconds -->
  <meta http-equiv="refresh" content="3;url=https://tabrador.app/app">
  <style>
    html, body {
      margin: 0; padding: 0;
      background: #1E3A8A;
      color: #F4F1EA;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      height: 100vh;
      display: flex; align-items: center; justify-content: center;
    }
    .card {
      text-align: center; padding: 3rem 2.5rem; max-width: 460px;
    }
    .emoji { font-size: 3rem; margin-bottom: 1.25rem; display: block; }
    h1 {
      font-size: 1.9rem; font-weight: 800; letter-spacing: -0.02em;
      margin: 0 0 0.9rem;
    }
    p { font-size: 0.95rem; color: #C5D8F0; line-height: 1.65; margin: 0 0 0.5rem; }
    .sub {
      font-size: 0.78rem; color: #8EAAD8; margin-top: 1.75rem;
    }
    .sub a { color: #C5D8F0; }
    .brand {
      font-size: 0.75rem; letter-spacing: 0.07em; text-transform: uppercase;
      color: #8EAAD8; margin-bottom: 1.75rem; display: block;
    }
  </style>
</head>
<body>
  <div class="card">
    <span class="brand">Tabrador — Fetch your tabs</span>
    <span class="emoji">🎉</span>
    <h1>Welcome to Tabrador Pro!</h1>
    <p>Your subscription is active. You now have unlimited workspaces and full access to all features.</p>
    <p class="sub">
      Taking you to your dashboard…
      <a href="https://tabrador.app/app">Click here</a> if it doesn't happen automatically.
    </p>
  </div>
</body>
</html>
